services:
  jmeter:
    image: eclipse-temurin:11
    default: true
    checkout: true

    commands:
      build:
        - apt-get update
        - apt-get install -y wget
        - wget https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
        - tar -xzf apache-jmeter-5.6.3.tgz

      start:
        - echo "JMeter pronto"
