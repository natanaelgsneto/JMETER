services:
  web:
    image: openjdk:11

    commands:
      init:
        - apt-get update
        - apt-get install -y wget unzip

        # Baixar JMeter
        - wget https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.zip
        - unzip apache-jmeter-5.6.3.zip

      start:
        - ./apache-jmeter-5.6.3/bin/jmeter -n -t teste.jmx -l resultados.jtl
        - sleep infinity
