services:
  jmeter:
    image: ubuntu:22.04
    default: true
    checkout: true

    commands:
      build:
        - apt-get update
        - apt-get install -y openjdk-11-jdk wget
        - wget https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
        - tar -xzf apache-jmeter-5.6.3.tgz

      start:
        - echo "JMeter pronto"
