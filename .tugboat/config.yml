services:
  app:
    image: tugboatqa/ubuntu:22.04

    commands:
      build:
        - apt-get update
        - apt-get install -y openjdk-17-jre wget unzip apache2

        # instalar JMeter
        - wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
        - tar -xzf apache-jmeter-5.6.3.tgz
        - mv apache-jmeter-5.6.3 /opt/jmeter

      init:
        # preparar pasta
        - rm -rf /var/lib/app
        - mkdir -p /var/lib/app

        # baixar seu teste
        - wget https://raw.githubusercontent.com/natanaelgsneto/JMETER/main/secao6_ambiente_completo/pronto.jmx -O /var/lib/app/pronto.jmx

        # rodar teste (não quebra build)
        - /opt/jmeter/bin/jmeter -n -t /var/lib/app/pronto.jmx -l /var/lib/app/resultado.jtl || true

        # gerar relatório
        - /opt/jmeter/bin/jmeter -g /var/lib/app/resultado.jtl -o /var/lib/app/relatorio || true

        # publicar no apache
        - rm -rf /var/www/html/*
        - cp -r /var/lib/app/relatorio/* /var/www/html/ || true

        # subir apache
        - service apache2 start
