services:
  app:
    image: tugboatqa/ubuntu:22.04

    commands:
      build:
        - apt-get update
        - apt-get install -y git openjdk-17-jre wget unzip apache2

        # baixar e instalar jmeter em /opt
        - wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
        - tar -xzf apache-jmeter-5.6.3.tgz
        - mv apache-jmeter-5.6.3 /opt/jmeter

        # validar instalação (CRÍTICO)
        - test -f /opt/jmeter/bin/jmeter
        - chmod +x /opt/jmeter/bin/jmeter
        - /opt/jmeter/bin/jmeter -v

      init:
        # validar novamente (se falhar aqui, já sabemos)
        - test -f /opt/jmeter/bin/jmeter

        # preparar ambiente
        - mkdir -p /var/lib/app

        # baixar script
        - wget https://raw.githubusercontent.com/natanaelgsneto/JMETER/main/secao6_ambiente_completo/pronto.jmx -O /var/lib/app/pronto.jmx

        # rodar teste
        - /opt/jmeter/bin/jmeter -n -t /var/lib/app/pronto.jmx -l /var/lib/app/resultado.jtl

        # gerar relatório
        - /opt/jmeter/bin/jmeter -g /var/lib/app/resultado.jtl -o /var/lib/app/relatorio

        # publicar
        - rm -rf /var/www/html/*
        - cp -r /var/lib/app/relatorio/* /var/www/html/

        # subir apache
        - service apache2 start
