services:
  web:
    image: openjdk:11

    commands:
      init:
        # instalar utilitários
        - apt-get update
        - apt-get install -y wget unzip

        # baixar JMeter
        - wget https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.zip
        - unzip apache-jmeter-5.6.3.zip

      start:
        # rodar o teste que já está no repositório
        - ./apache-jmeter-5.6.3/bin/jmeter -n -t secao6_ambiente_completo/teste.jmx -l resultados.jtl
        # manter o container vivo
        - sleep infinity
