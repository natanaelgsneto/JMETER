services:
  app:
    image: tugboatqa/ubuntu:22.04

    commands:
      build:
        - apt-get update
        - apt-get install -y git openjdk-17-jre wget unzip apache2

        # ===== INSTALAR JMETER =====
        - wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
        - tar -xzf apache-jmeter-5.6.3.tgz

        # descobrir nome da pasta automaticamente
        - JMETER_DIR=$(ls -d apache-jmeter-*)

        # mover corretamente
        - mv $JMETER_DIR /opt/jmeter

        # adicionar no PATH (PROFISSIONAL)
        - export PATH=$PATH:/opt/jmeter/bin

        # validar instalação
        - /opt/jmeter/bin/jmeter -v

      init:
        - export PATH=$PATH:/opt/jmeter/bin

        # criar pasta
        - rm -rf /var/lib/app
        - mkdir -p /var/lib/app

        # baixar jmx
        - wget https://raw.githubusercontent.com/natanaelgsneto/JMETER/main/secao6_ambiente_completo/pronto.jmx -O /var/lib/app/pronto.jmx

        # rodar teste (agora sem erro)
        - jmeter -n -t /var/lib/app/pronto.jmx -l /var/lib/app/resultado.jtl

        # gerar relatório
        - jmeter -g /var/lib/app/resultado.jtl -o /var/lib/app/relatorio

        # publicar
        - rm -rf /var/www/html/*
        - cp -r /var/lib/app/relatorio/* /var/www/html/

        # subir apache
        - service apache2 start
