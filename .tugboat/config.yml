services:
  app:
    image: tugboatqa/ubuntu:22.04

    commands:
      build:
        - apt-get update
        - apt-get install -y git openjdk-17-jre wget unzip

        - wget https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
        - tar -xvzf apache-jmeter-5.6.3.tgz
        - mv apache-jmeter-5.6.3 /opt/jmeter

      init:
        - git clone https://github.com/natanaelgsneto/JMETER.git /var/lib/tugboat
